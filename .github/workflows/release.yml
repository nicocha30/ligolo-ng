name: goreleaser

on:
  push:
    # run only against tags
    tags:
      - "*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
      -
        name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
      -
        name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/ligolo-ng-relay-web/package-lock.json
      -
        name: Set up Helm
        uses: azure/setup-helm@v5
      -
        name: Verify upstream ancestry
        run: |
          git remote add upstream https://github.com/nicocha30/ligolo-ng.git
          git fetch upstream master
          git merge-base --is-ancestor upstream/master HEAD
      -
        name: Install Web UI dependencies
        run: npm ci
        working-directory: web/ligolo-ng-relay-web
      -
        name: Build Web UI
        run: npm run build
        working-directory: web/ligolo-ng-relay-web
      -
        name: Audit Web UI dependencies
        run: npm audit --audit-level=moderate
        working-directory: web/ligolo-ng-relay-web
      -
        name: Go vet
        run: go vet ./...
      -
        name: Go test
        run: go test ./...
      -
        name: Go race test
        run: go test -race ./...
      -
        name: Build commands
        run: go build ./cmd/proxy ./cmd/agent ./cmd/relayctl ./cmd/relaymcp
      -
        name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      -
        name: Gosec TLS pinning check
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet -include=G123 -tests ./...
      -
        name: GoReleaser check
        run: go run github.com/goreleaser/goreleaser/v2@v2.16.0 check --config .goreleaser.yaml
      -
        name: Helm template check
        run: helm template ligolo deploy/helm/ligolo-ng-relay --set proxy.webPassword=ci-password >/dev/null
      -
        name: Run relay integration lab
        run: make relay-test
      -
        name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Install cosign
        uses: sigstore/cosign-installer@v4.1.0
      -
        name: Install syft
        uses: anchore/sbom-action/download-syft@v0
      -
        name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro'
          distribution: goreleaser
          version: v2.16.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
