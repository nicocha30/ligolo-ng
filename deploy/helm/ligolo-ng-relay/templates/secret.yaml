{{- if not .Values.proxy.existingSecret }}
{{- $password := required "proxy.webPassword must be set when proxy.existingSecret is empty" .Values.proxy.webPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ligolo-ng-relay.fullname" . }}
type: Opaque
stringData:
  web-user: {{ .Values.proxy.webUser | quote }}
  web-password: {{ $password | quote }}
{{- end }}
